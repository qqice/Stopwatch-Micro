<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stopwatch Micro — UI Review</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f7f0;
      --muted: #a3aca7;
      --dim: #606964;
      --line: rgba(247,247,239,.2);
      --surface: rgba(255,255,250,.08);
      --surface-hi: rgba(255,255,250,.16);
      --key: #f1f0eb;
      --key-hi: #fffefa;
      --key-low: #e1e2dd;
      --key-ink: #171a18;
      --key-muted: #69716d;
      --key-border: rgba(255,255,250,.72);
      --key-shadow: 0 7px 16px rgba(0,0,0,.26);
      --green: #59e3a5;
      --blue: #6f9fff;
      --amber: #f4b84b;
      --red: #ff666a;
      --codex-blue: #566bf7;
      --codex-blue-hi: #9da1fc;
      --codex-lavender: #c2b8ff;
      --codex-indigo: #352ec8;
      --codex-violet: #a76bb0;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      overflow-x: hidden;
      color: var(--ink);
      background: #0a0d0b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }

    .review-layout {
      display: grid;
      grid-template-columns: 556px minmax(320px, 420px);
      align-items: center;
      gap: 64px;
      width: min(1040px, 100%);
      min-width: 0;
    }
    .device-preview {
      width: 556px;
      height: 520px;
    }
    .device-stage {
      position: relative;
      width: 556px;
      height: 520px;
    }
    .device {
      position: absolute;
      left: 45px;
      top: 27px;
      z-index: 2;
      width: 466px;
      height: 466px;
      overflow: hidden;
      border-radius: 50%;
      isolation: isolate;
      background: radial-gradient(circle at 50% 39%, #1a1e1b 0, #0d100f 66%, #070908 100%);
      box-shadow: 0 0 0 2px #424a46, 0 0 0 12px #111513, 0 0 0 14px #2b312e, 0 26px 72px rgba(0,0,0,.58);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .device::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent 49.85%, rgba(255,255,255,.025) 50%, transparent 50.15%);
      pointer-events: none;
    }
    .ambient-ring {
      position: absolute;
      inset: 1px;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(farthest-side,
        transparent calc(100% - 29px),
        rgba(116,126,215,.018) calc(100% - 28px),
        rgba(116,126,215,.42) 100%);
    }
    .device.is-pairing .ambient-ring { opacity: 0; }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateX(16px) scale(.99);
      pointer-events: none;
      transition: opacity .18s ease, transform .22s ease;
    }
    .page.active { opacity: 1; transform: none; pointer-events: auto; }
    .device.is-pairing .page,
    .device.is-pairing .touch-control { pointer-events: none; }
    .control-grid {
      position: absolute;
      top: 104px;
      left: 48px;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 78px;
      gap: 10px 12px;
    }
    .action {
      position: relative;
      min-width: 0;
      min-height: 64px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      color: var(--ink);
      background: linear-gradient(145deg, var(--surface-hi), var(--surface));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 7px 16px rgba(0,0,0,.28);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .08s ease, border-color .12s ease, background .12s ease;
    }
    .action.is-pressed { transform: scale(.965); border-color: var(--green); }
    .action-copy { min-width: 0; text-align: left; }
    .action-name {
      display: block;
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -.01em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .action-id {
      display: block;
      margin-top: 5px;
      color: var(--key-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: .01em;
    }
    .light {
      flex: 0 0 auto;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(23,26,24,.13);
      border-radius: 50%;
      background: #3d4441;
    }
    .task {
      min-height: 78px;
      padding: 12px 17px;
      border-color: var(--key-border);
      border-radius: 28px;
      color: var(--key-ink);
      background: linear-gradient(145deg, var(--key-hi), var(--key-low) 88%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.86), var(--key-shadow);
    }
    .task::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 22px;
      background: rgba(255,255,255,.055);
      pointer-events: none;
    }
    .task .action-copy,
    .task .light { position: relative; z-index: 1; }
    .task .action-name { font-size: 15px; }
    .task .action-id { margin-top: 6px; }
    .task.is-pressed { border-color: rgba(86,107,247,.58); }
    .task[data-light="idle"] .light { background: #f7f7f1; box-shadow: 0 0 0 3px rgba(23,26,24,.08); }
    .task[data-light="thinking"] .light { background: var(--blue); box-shadow: 0 0 0 3px rgba(111,159,255,.13); animation: status-pulse 1.8s ease-in-out infinite; }
    .task[data-light="complete"] .light { background: var(--green); box-shadow: 0 0 0 3px rgba(89,227,165,.12); }
    .task[data-light="input"] .light { background: var(--amber); box-shadow: 0 0 0 3px rgba(244,184,75,.13); }
    .task[data-light="error"] .light { background: var(--red); box-shadow: 0 0 0 3px rgba(255,102,106,.12); }
    .task[data-light="off"] .light { border-color: rgba(23,26,24,.1); background: #aeb4b0; box-shadow: none; }

    .command-deck {
      position: absolute;
      inset: 0;
    }
    .command-ring {
      position: absolute;
      left: 83px;
      top: 83px;
      z-index: 1;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(48,56,51,.4);
      border-radius: 50%;
      pointer-events: none;
    }
    .command {
      --command-accent: 111, 159, 255;
      position: absolute;
      z-index: 3;
      width: 78px;
      height: 78px;
      min-height: 78px;
      isolation: isolate;
      padding: 0 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,250,.96);
      border-radius: 50%;
      color: #151817;
      background:
        radial-gradient(circle at 31% 22%, rgba(255,255,255,.96) 0 7%, rgba(255,255,255,0) 31%),
        linear-gradient(145deg, #fffefa 0%, #f1f3ef 42%, #d9ded9 100%);
      filter: drop-shadow(0 7px 9px rgba(0,0,0,.25));
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.98),
        inset 0 -5px 8px rgba(33,42,37,.12),
        0 2px 0 rgba(83,92,87,.72),
        0 0 0 1px rgba(var(--command-accent),.08);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .04em;
      line-height: 1.05;
      text-shadow: 0 1px 0 rgba(255,255,255,.92);
      transition: transform .08s ease, border-color .12s ease, background .12s ease,
        box-shadow .12s ease, filter .12s ease, color .12s ease;
    }
    .command::before {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: -1;
      border: 1px solid rgba(89,99,93,.2);
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,0) 48%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.72), inset 0 -1px 1px rgba(32,40,36,.08);
      pointer-events: none;
    }
    .command::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 18px;
      right: 18px;
      z-index: -1;
      height: 10px;
      border-top: 1px solid rgba(255,255,255,.92);
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.18), transparent);
      pointer-events: none;
    }
    .command:hover {
      border-color: rgba(255,255,255,1);
      filter: brightness(1.025) drop-shadow(0 8px 10px rgba(0,0,0,.27));
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,1),
        inset 0 -5px 8px rgba(33,42,37,.11),
        0 2px 0 rgba(83,92,87,.72),
        0 0 0 2px rgba(var(--command-accent),.15);
    }
    .command-plan { --command-accent: 139, 157, 255; left: 119px; top: 64px; }
    .command-new-task { --command-accent: 185, 153, 255; left: 269px; top: 64px; }
    .command-fast { --command-accent: 244, 184, 75; left: 44px; top: 194px; }
    .command-fork { --command-accent: 111, 159, 255; left: 344px; top: 194px; }
    .command-approve { --command-accent: 89, 227, 165; left: 119px; top: 324px; }
    .command-decline { --command-accent: 255, 102, 106; left: 269px; top: 324px; }
    .command.is-pressed {
      color: #101312;
      transform: translateY(2px) scale(.945);
      border-color: rgba(var(--command-accent),.75);
      background:
        radial-gradient(circle at 36% 28%, rgba(255,255,255,.72), transparent 34%),
        linear-gradient(145deg, #e2e7e2, #f6f8f5 70%);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.28));
      box-shadow:
        inset 0 4px 8px rgba(35,45,39,.15),
        inset 0 -1px 1px rgba(255,255,255,.9),
        0 1px 0 rgba(74,83,78,.6),
        0 0 0 3px rgba(var(--command-accent),.2);
    }

    .usage-card {
      position: absolute;
      left: 146px;
      top: 146px;
      z-index: 2;
      width: 174px;
      height: 174px;
      padding: 12px 25px;
      border: 1px solid #3b4540;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 32%, #18201c 0, #111613 72%);
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 8px 18px rgba(0,0,0,.2);
      text-align: center;
      pointer-events: none;
    }
    .usage-title { color: #69716d; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
    .usage-value { margin-top: 5px; font-size: 28px; font-weight: 700; letter-spacing: -.04em; }
    .usage-track { width: 116px; height: 8px; margin: 7px auto 0; overflow: hidden; border-radius: 4px; background: #29302c; }
    .usage-fill { width: 82%; height: 100%; border-radius: inherit; background: var(--green); }
    .usage-reset { margin-top: 11px; font-size: 14px; }
    .usage-divider { width: 116px; height: 1px; margin: 12px auto 0; background: #3b4540; }
    .watch-status {
      min-height: 18px;
      margin-top: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #e9efeb;
      font-size: 14px;
      line-height: 1;
    }
    .watch-battery {
      width: 29px;
      height: 17px;
      overflow: visible;
      filter: drop-shadow(0 0 4px rgba(89,227,165,.16));
    }
    .watch-battery-outline {
      fill: none;
      stroke: #aeb8b2;
      stroke-width: 1.35;
    }
    .watch-battery-cap { fill: #aeb8b2; }
    .watch-battery-level { fill: var(--green); }
    .watch-battery-bolt { fill: #122019; }
    .watch-percent {
      min-width: 34px;
      font-size: 14px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }

    .command-navigation {
      position: absolute;
      inset: 0;
      width: 466px;
      height: 466px;
    }
    .arc-slider {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 466px;
      height: 466px;
      overflow: visible;
      touch-action: none;
      pointer-events: none;
      outline: none;
    }
    .arc-track-shadow,
    .arc-track {
      fill: none;
      pointer-events: none;
    }
    .arc-track-shadow {
      stroke: rgba(0,0,0,.42);
      stroke-width: 8;
    }
    .arc-track {
      stroke: rgba(190,195,192,.45);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke .12s ease, stroke-width .12s ease;
    }
    .arc-slider:focus-visible .arc-track { stroke: rgba(220,224,222,.86); stroke-width: 6; }
    .arc-thumb { cursor: grab; will-change: transform; }
    .arc-slider.dragging .arc-thumb { cursor: grabbing; }
    .arc-thumb-hit { fill: transparent; pointer-events: all; }
    .arc-thumb-block {
      fill: #626763;
      stroke: #a9aeab;
      stroke-width: 1.5;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,.34));
      transition: fill .1s ease, stroke .1s ease;
    }
    .arc-slider.dragging .arc-thumb-block { fill: #747a76; stroke: #d1d5d3; }
    .arc-slider.returning .arc-thumb-block { fill: #656a67; stroke: #a6aca8; }
    .arc-slider.returning .arc-thumb,
    .arc-slider.returning .arc-thumb * { pointer-events: none !important; }
    .arc-thumb-grip { stroke: rgba(238,241,239,.58); stroke-width: 1.5; stroke-linecap: round; pointer-events: none; }
    .reasoning-title,
    .reasoning-sign { position: absolute; z-index: 3; pointer-events: none; }
    .reasoning-title { left: 50%; top: 48px; transform: translateX(-50%); color: var(--white); font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .reasoning-sign { top: 88px; color: #69716d; font-size: 28px; line-height: 1; }
    .reasoning-minus { left: 72px; }
    .reasoning-plus { left: 376px; }

    .touch-control {
      position: absolute;
      left: 50%;
      bottom: -17px;
      z-index: 8;
      width: 154px;
      height: 68px;
      padding: 11px 0 0;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(247,247,239,.26);
      border-bottom: 0;
      border-radius: 77px 77px 0 0 / 34px 34px 0 0;
      color: #c9cecb;
      background: rgba(255,255,250,.075);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 -5px 14px rgba(0,0,0,.18);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .08s ease, border-color .12s ease, color .12s ease;
    }
    .touch-control::before {
      content: "";
      position: absolute;
      inset: 7px 14px -12px;
      border-radius: 63px 63px 0 0 / 26px 26px 0 0;
      background: rgba(255,255,250,.025);
      pointer-events: none;
    }
    .touch-icon {
      position: relative;
      z-index: 1;
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .touch-control.is-pressed { transform: translateX(-50%) scale(.96); border-color: rgba(89,227,165,.72); color: var(--green); }

    .status-announcer {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .mic-screen {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 39%, #1a1e1b 0, #0d100f 66%, #070908 100%);
      transition: opacity .12s ease, visibility .12s ease;
    }
    .mic-screen.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .mic-content {
      display: grid;
      justify-items: center;
      gap: 42px;
      transform: translateY(-7px);
    }
    .mic-icon-wrap {
      position: relative;
      width: 128px;
      height: 128px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,250,.82);
      border-radius: 44px;
      color: #151817;
      background: linear-gradient(145deg, var(--key-hi), var(--key-low) 90%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 8px 18px rgba(0,0,0,.28);
    }
    .mic-icon {
      width: 60px;
      height: 60px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mic-meter {
      width: 204px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }
    .mic-meter span {
      width: 8px;
      height: 54px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fffefa, #c8ccc7);
      box-shadow: 0 2px 5px rgba(0,0,0,.2);
      opacity: .26;
      transform: scaleY(.12);
      transition: transform .13s ease-out, opacity .13s ease-out;
      transform-origin: center;
    }
    .mic-screen.show .mic-meter span { opacity: .72; }
    .mic-source {
      margin-top: -30px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .pairing-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #202421 0, #111513 47%, #080a09 78%);
      transition: opacity .18s ease, visibility .18s ease;
    }
    .pairing-screen.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .pairing-content { display: grid; justify-items: center; gap: 24px; transform: translateY(-4px); }
    .pairing-pulse {
      position: relative;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(247,247,239,.24);
      border-radius: 50%;
    }
    .pairing-pulse::before,
    .pairing-pulse::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(247,247,239,.18);
      border-radius: inherit;
      animation: pairing-wave 2.1s ease-out infinite;
    }
    .pairing-pulse::after { animation-delay: 1.05s; }
    .pairing-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f5f5ef;
      box-shadow: 0 0 20px rgba(247,247,239,.3);
      animation: pairing-core 1.4s ease-in-out infinite;
    }
    .pairing-title {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.015em;
    }
    .pairing-dots { display: flex; gap: 8px; }
    .pairing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9aa29e;
      animation: pairing-dot 1.2s ease-in-out infinite;
    }
    .pairing-dots span:nth-child(2) { animation-delay: .16s; }
    .pairing-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes pairing-wave {
      0% { opacity: .7; transform: scale(.82); }
      80%, 100% { opacity: 0; transform: scale(1.75); }
    }
    @keyframes pairing-core { 50% { opacity: .58; transform: scale(.78); } }
    @keyframes pairing-dot { 0%, 70%, 100% { opacity: .28; } 35% { opacity: 1; } }
    .hardware-key {
      position: absolute;
      top: 52px;
      z-index: 1;
      width: 36px;
      height: 76px;
      padding: 0;
      border: 2px solid rgba(255,255,255,.25);
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 2px 2px rgba(255,255,255,.28), inset 0 -4px 6px rgba(0,0,0,.18), 0 8px 17px rgba(0,0,0,.38);
      transition: transform .08s ease, filter .12s ease, opacity .12s ease;
    }
    .hardware-key.key-a {
      left: 87px;
      background: linear-gradient(145deg, #ffd55b, #efaa24 76%);
      transform: rotate(-42deg);
    }
    .hardware-key.key-b {
      right: 87px;
      background: linear-gradient(145deg, #75b9ff, #3d82e8 76%);
      transform: rotate(42deg);
    }
    .hardware-key.key-a:active,
    .hardware-key.key-a.held { transform: rotate(-42deg) scale(.9); filter: brightness(1.13); }
    .hardware-key.key-b:active,
    .hardware-key.key-b.held { transform: rotate(42deg) scale(.9); filter: brightness(1.13); }
    .hardware-key:disabled { opacity: .55; cursor: not-allowed; }

    .review-copy {
      min-width: 0;
      max-width: 420px;
    }
    .review-kicker {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .review-title {
      margin: 0;
      font-size: clamp(42px, 5vw, 64px);
      font-weight: 650;
      line-height: .98;
      letter-spacing: -.055em;
    }
    .review-description {
      max-width: 390px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }
    .review-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 30px;
    }
    .review-control {
      --control-accent: var(--green);
      position: relative;
      min-width: 0;
      min-height: 82px;
      overflow: hidden;
      border: 1px solid rgba(247,247,239,.18);
      border-radius: 20px;
      padding: 16px 12px 13px;
      color: var(--ink);
      background: rgba(255,255,250,.055);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .08s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
    }
    .review-control::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 2px;
      border-radius: 0 0 2px 2px;
      background: var(--control-accent);
      opacity: .9;
    }
    .review-control:hover { border-color: rgba(247,247,239,.34); background: rgba(255,255,250,.085); }
    .review-control:active,
    .review-control.held { transform: scale(.965); border-color: var(--control-accent); }
    .review-control:disabled { opacity: .42; cursor: not-allowed; }
    .review-control-a { --control-accent: #f5bd3f; }
    .review-control-b { --control-accent: #5a9cf4; }
    .review-control-combo { --control-accent: var(--green); }
    .review-control-key {
      display: block;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .review-control-label {
      display: block;
      margin-top: 10px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 550;
      line-height: 1.2;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    body.embed { width: 556px; height: 520px; min-height: 520px; padding: 0; overflow: hidden; background: #080b09; }
    body.embed .review-layout,
    body.embed .device-preview,
    body.embed .device-stage { width: 556px; height: 520px; }
    body.embed .review-layout { display: block; }
    body.embed .review-copy { display: none; }
    body.embed .device { box-shadow: 0 0 0 2px #424a46, 0 0 0 12px #111513, 0 0 0 14px #2b312e; }

    @keyframes status-pulse { 50% { opacity: .45; transform: scale(.78); } }
    @media (max-width: 1040px) {
      body:not(.embed) .review-layout {
        grid-template-columns: 1fr;
        gap: 28px;
        width: 556px;
      }
      body:not(.embed) .review-copy {
        max-width: 556px;
        padding: 0 34px;
      }
      body:not(.embed) .review-description { max-width: 480px; }
    }
    @media (max-width: 604px) {
      body { padding: 12px; }
      body:not(.embed) .review-layout {
        width: min(556px, calc(100vw - 24px));
        gap: 24px;
      }
      body:not(.embed) .device-preview {
        width: min(556px, calc(100vw - 24px));
        height: min(520px, calc(93.525vw - 22.446px));
      }
      body:not(.embed) .device-stage {
        width: 556px;
        height: 520px;
        transform: scale(calc((100vw - 24px) / 556px));
        transform-origin: top left;
      }
      body:not(.embed) .review-copy { padding: 0 8px 16px; }
      .review-title { font-size: clamp(40px, 13vw, 58px); }
      .review-description { margin-top: 18px; font-size: 15px; }
      .review-controls { margin-top: 24px; }
      .review-control { min-height: 76px; padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="review-layout">
    <div class="device-preview">
      <section class="device-stage" aria-label="466 by 466 circular display preview">
        <div class="device" id="device" data-display-mode="always-on">
        <div class="ambient-ring" aria-hidden="true"></div>
        <section class="page active" data-page="0" aria-label="Command controls">
          <div class="command-deck">
            <div class="command-ring" aria-hidden="true"></div>
            <button class="action command command-plan" type="button" data-action="PLAN" aria-label="Plan radial action">PLAN</button>
            <button class="action command command-fast" type="button" data-action="ACT06" aria-label="Fast mode — ACT06">FAST</button>
            <button class="action command command-approve" type="button" data-action="ACT07" aria-label="Approve — ACT07">APPROVE</button>
            <button class="action command command-new-task" type="button" data-action="ACT11" aria-label="New task — ACT11">NEW<br>TASK</button>
            <button class="action command command-fork" type="button" data-action="ACT09" aria-label="Fork — ACT09">FORK</button>
            <button class="action command command-decline" type="button" data-action="ACT08" aria-label="Decline — ACT08">DECLINE</button>
            <div class="usage-card" aria-label="Codex usage 82 percent remaining, reset in 6 days 18 hours, watch battery 98 percent charging">
              <div class="usage-title">CODEX</div>
              <div class="usage-value">82.00%</div>
              <div class="usage-track"><div class="usage-fill"></div></div>
              <div class="usage-reset">RESET 6d 18h</div>
              <div class="usage-divider"></div>
              <div class="watch-status" aria-label="Watch battery 98 percent, charging">
                <svg class="watch-battery" viewBox="0 0 31 18" aria-hidden="true">
                  <rect class="watch-battery-outline" x=".75" y="1.75" width="26" height="14.5" rx="3" />
                  <path class="watch-battery-cap" d="M28.5 6h1.25c.69 0 1.25.56 1.25 1.25v3.5c0 .69-.56 1.25-1.25 1.25H28.5z" />
                  <rect class="watch-battery-level" x="3.5" y="4.5" width="21.5" height="9" rx="1.8" />
                  <path class="watch-battery-bolt" d="M15.8 5.2 11.6 10h3l-.5 3.1 4.4-5.2h-3.1z" />
                </svg>
                <span class="watch-percent">98%</span>
              </div>
            </div>
          </div>
          <div class="command-navigation">
            <span class="reasoning-title">REASONING</span>
            <span class="reasoning-sign reasoning-minus">−</span>
            <span class="reasoning-sign reasoning-plus">+</span>
            <svg class="arc-slider" id="arcSlider" viewBox="0 0 466 466" role="slider" tabindex="0" aria-label="Reasoning effort: drag right to increase or left to decrease, release to return, tap to select" aria-valuemin="-10" aria-valuemax="10" aria-valuenow="0" aria-valuetext="Centered">
              <path class="arc-track-shadow" d="M 52.9 129 A 208 208 0 0 1 413.1 129" />
              <path class="arc-track" d="M 52.9 129 A 208 208 0 0 1 413.1 129" />
              <g class="arc-thumb" id="arcThumb">
                <circle class="arc-thumb-hit" r="23" />
                <rect class="arc-thumb-block" x="-23" y="-15" width="46" height="30" rx="9" />
                <path class="arc-thumb-grip" d="M -8 -7 V 7 M 0 -7 V 7 M 8 -7 V 7" />
              </g>
            </svg>
          </div>
        </section>

        <section class="page" data-page="1" aria-label="Agent Keys">
          <div class="control-grid">
            <button class="action task" type="button" data-action="AG00" data-light="thinking"><span class="action-copy"><span class="action-name">Agent 1</span><span class="action-id">Thinking</span></span><span class="light"></span></button>
            <button class="action task" type="button" data-action="AG01" data-light="input"><span class="action-copy"><span class="action-name">Agent 2</span><span class="action-id">Needs input</span></span><span class="light"></span></button>
            <button class="action task" type="button" data-action="AG02" data-light="complete"><span class="action-copy"><span class="action-name">Agent 3</span><span class="action-id">Complete</span></span><span class="light"></span></button>
            <button class="action task" type="button" data-action="AG03" data-light="idle"><span class="action-copy"><span class="action-name">Agent 4</span><span class="action-id">Idle</span></span><span class="light"></span></button>
            <button class="action task" type="button" data-action="AG04" data-light="error"><span class="action-copy"><span class="action-name">Agent 5</span><span class="action-id">Error</span></span><span class="light"></span></button>
            <button class="action task" type="button" data-action="AG05" data-light="off"><span class="action-copy"><span class="action-name">Agent 6</span><span class="action-id">Unassigned</span></span><span class="light"></span></button>
          </div>
        </section>

        <section class="mic-screen" id="micScreen" aria-label="Computer microphone push to talk" aria-hidden="true" inert>
          <div class="mic-content">
            <div class="mic-icon-wrap" aria-hidden="true">
              <svg class="mic-icon" viewBox="0 0 64 64">
                <rect x="23" y="9" width="18" height="32" rx="9" />
                <path d="M16 31v2c0 9 7.2 16 16 16s16-7 16-16v-2M32 49v8M24 57h16" />
              </svg>
            </div>
            <div class="mic-meter" id="micMeter" role="meter" aria-label="Push to talk activity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="mic-source">PTT / COMPUTER MIC</div>
          </div>
        </section>

        <button class="touch-control" id="touchControl" type="button" aria-label="Touch sensor · hold three seconds to restart pairing">
          <svg class="touch-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M5.5 16.5C5.5 10 10.1 5 16 5s10.5 5 10.5 11.5"/>
            <path d="M8.5 17c0-5 3.3-9 7.5-9s7.5 4 7.5 9c0 4.6-.8 8.1-2.4 10.7"/>
            <path d="M11.5 17.2c0-3.3 1.9-5.8 4.5-5.8s4.5 2.5 4.5 5.8c0 5.1-1.4 8.9-3.5 11.5"/>
            <path d="M16 16.8c0 4.6-.8 7.9-2.8 10.4M8.3 21.1c-.3 2.2-1 4-2 5.3"/>
          </svg>
        </button>

        <div class="status-announcer" id="eventLine" aria-live="polite">PAIRING</div>

        <section class="pairing-screen show" id="pairingScreen" aria-label="Bluetooth pairing" aria-hidden="false">
          <div class="pairing-content">
            <div class="pairing-pulse" aria-hidden="true"><span class="pairing-core"></span></div>
            <strong class="pairing-title">Pairing</strong>
            <div class="pairing-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
        </section>

        </div>
        <button class="hardware-key key-a" id="keyA" type="button" aria-label="Yellow hardware button A: hold for microphone"></button>
        <button class="hardware-key key-b" id="keyB" type="button" aria-label="Blue hardware button B: send"></button>
      </section>
    </div>

    <aside class="review-copy" aria-labelledby="reviewTitle">
      <p class="review-kicker">Codex control surface</p>
      <h1 class="review-title" id="reviewTitle">Stopwatch Micro</h1>
      <p class="review-description">圆屏交互预览。A 按住说话，B 发送消息，同时按下 A+B 可在 Command 与 Agent 页面之间切换。</p>
      <div class="review-controls" aria-label="Physical key controls">
        <button class="review-control review-control-a" id="reviewKeyA" type="button">
          <span class="review-control-key">A</span>
          <span class="review-control-label">按住说话</span>
        </button>
        <button class="review-control review-control-b" id="reviewKeyB" type="button">
          <span class="review-control-key">B</span>
          <span class="review-control-label">发送消息</span>
        </button>
        <button class="review-control review-control-combo" id="reviewCombo" type="button">
          <span class="review-control-key">A+B</span>
          <span class="review-control-label">切换页面</span>
        </button>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('embed') === '1') document.body.classList.add('embed');

      const pages = [...document.querySelectorAll('.page')].sort((a, b) => Number(a.dataset.page) - Number(b.dataset.page));
      const device = document.getElementById('device');
      const eventLine = document.getElementById('eventLine');
      const touchControl = document.getElementById('touchControl');
      const pairingScreen = document.getElementById('pairingScreen');
      const micScreen = document.getElementById('micScreen');
      const micMeter = document.getElementById('micMeter');
      const micBars = [...micMeter.querySelectorAll('span')];
      const keyA = document.getElementById('keyA');
      const keyB = document.getElementById('keyB');
      const reviewKeyA = document.getElementById('reviewKeyA');
      const reviewKeyB = document.getElementById('reviewKeyB');
      const reviewCombo = document.getElementById('reviewCombo');
      const arcSlider = document.getElementById('arcSlider');
      const arcThumb = document.getElementById('arcThumb');
      const requestedStart = Number(params.get('start'));
      const initialPaired = params.get('paired') !== '0';
      const initialMic = params.get('mic') === '1';
      let page = Number.isInteger(requestedStart) && requestedStart >= 0 && requestedStart < pages.length ? requestedStart : 0;
      let paired = false;
      const held = new Set();
      let comboLatched = false;
      let micActive = false;
      let micLevelTimer = 0;
      let micPhase = 0;
      let micSmoothedLevel = .18;

      const setEvent = (text) => { eventLine.textContent = text; };

      function updateMicLevel() {
        micPhase += .55;
        const base = .24 + (Math.sin(micPhase) + 1) * .17;
        const rawLevel = Math.min(1, base + Math.random() * .34);
        micSmoothedLevel += (rawLevel - micSmoothedLevel) * .38;
        const level = micSmoothedLevel;
        const center = (micBars.length - 1) / 2;
        micBars.forEach((bar, index) => {
          const falloff = Math.abs(index - center) / center;
          const ripple = .76 + Math.sin(micPhase * 1.35 + index * .8) * .24;
          const height = Math.max(.12, Math.min(1, level * ripple * (1 - falloff * .28)));
          bar.style.transform = `scaleY(${height.toFixed(3)})`;
          bar.style.opacity = String((.35 + height * .65).toFixed(3));
        });
        micMeter.setAttribute('aria-valuenow', String(Math.round(level * 100)));
      }

      function setMicActive(nextActive) {
        const active = Boolean(nextActive && paired && !comboLatched);
        if (active === micActive) return;
        micActive = active;
        clearInterval(micLevelTimer);
        micLevelTimer = 0;
        micScreen.classList.toggle('show', micActive);
        micScreen.setAttribute('aria-hidden', String(!micActive));
        micScreen.inert = !micActive;
        device.classList.toggle('is-mic', micActive);
        if (micActive) {
          micSmoothedLevel = .18;
          updateMicLevel();
          micLevelTimer = window.setInterval(updateMicLevel, 120);
        } else {
          micMeter.setAttribute('aria-valuenow', '0');
          micBars.forEach((bar) => {
            bar.style.transform = 'scaleY(.12)';
            bar.style.opacity = '.26';
          });
        }
        syncFunctionalAvailability();
      }

      function syncFunctionalAvailability() {
        pages.forEach((item, index) => {
          const available = paired && !micActive && index === page;
          item.inert = !available;
          item.setAttribute('aria-hidden', String(!available));
        });
        touchControl.disabled = !paired || micActive;
        [keyA, keyB].forEach((button) => { if (button) button.disabled = !paired; });
        [reviewKeyA, reviewKeyB, reviewCombo].forEach((button) => { if (button) button.disabled = !paired; });
      }

      function showPage(next, force = false) {
        if (!paired && !force) return;
        if (micActive) setMicActive(false);
        page = (next + pages.length) % pages.length;
        pages.forEach((item, index) => item.classList.toggle('active', index === page));
        syncFunctionalAvailability();
        setEvent(page === 0 ? 'COMMAND · 6 TOUCH + REASONING' : 'AGENTS · 6 / 6');
      }

      function setPaired(nextPaired) {
        paired = Boolean(nextPaired);
        setMicActive(false);
        held.clear();
        comboLatched = false;
        keyA?.classList.remove('held');
        keyB?.classList.remove('held');
        reviewKeyA?.classList.remove('held');
        reviewKeyB?.classList.remove('held');
        reviewCombo?.classList.remove('held');
        touchControl.classList.remove('is-pressed');
        if (!paired) {
          clearTimeout(touchHoldTimer);
          clearTimeout(arcHoldTimer);
          cancelArcReturn();
          touchLong = false;
          arcPointer = null;
          arcSlider.classList.remove('dragging');
          arcStep = ARC_CENTER_STEP;
          updateArcThumb();
        }
        device.classList.toggle('is-pairing', !paired);
        pairingScreen.classList.toggle('show', !paired);
        pairingScreen.setAttribute('aria-hidden', String(paired));
        pairingScreen.inert = paired;
        if (paired) {
          showPage(0, true);
          setEvent('CONNECTED · COMMAND');
        } else {
          syncFunctionalAvailability();
          setEvent('PAIRING');
        }
      }

      document.querySelectorAll('.action').forEach((button) => {
        const release = () => button.classList.remove('is-pressed');
        button.addEventListener('pointerdown', (event) => {
          if (!paired) return;
          button.setPointerCapture?.(event.pointerId);
          button.classList.add('is-pressed');
        });
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });

      document.querySelectorAll('.task').forEach((task) => {
        let previousTap = 0;
        task.addEventListener('click', () => {
          const now = performance.now();
          const focusApp = now - previousTap < 350;
          setEvent(`${focusApp ? 'FOCUS CHAT' : 'SWITCH CHAT'} · ${task.dataset.action}`);
          previousTap = now;
        });
      });

      const commandLabels = {
        PLAN: 'PLAN · RADIAL PRESS / NEUTRAL RELEASE',
        ACT06: 'FAST MODE · TOGGLE',
        ACT07: 'APPROVE CURRENT REQUEST',
        ACT08: 'DECLINE CURRENT REQUEST',
        ACT09: 'FORK · CONTINUE IN NEW CHAT',
        ACT11: 'NEW TASK'
      };
      Object.entries(commandLabels).forEach(([action, label]) => {
        document.querySelector(`[data-action="${action}"]`)?.addEventListener('click', () => setEvent(label));
      });

      function releaseMicControl() {
        setMicActive(false);
        setEvent('VOICE · READY');
      }

      const ARC_CENTER = 233;
      const ARC_RADIUS = 208;
      const ARC_START_DEGREES = 210;
      const ARC_END_DEGREES = 330;
      const ARC_STEP_COUNT = 20;
      const ARC_CENTER_STEP = ARC_STEP_COUNT / 2;
      const ARC_RETURN_MS = 240;
      let arcStep = ARC_CENTER_STEP;
      let arcVisualStep = arcStep;
      let arcAngle = ARC_START_DEGREES + (ARC_END_DEGREES - ARC_START_DEGREES) * (arcStep / ARC_STEP_COUNT);
      let arcPointer = null;
      let arcMoved = false;
      let arcLong = false;
      let arcHoldTimer = 0;
      let arcReturnTimer = 0;
      let arcReturnFrame = 0;

      function positionArcThumb(step = arcVisualStep) {
        arcVisualStep = step;
        arcAngle = ARC_START_DEGREES + (ARC_END_DEGREES - ARC_START_DEGREES) * (arcVisualStep / ARC_STEP_COUNT);
        const radians = arcAngle * Math.PI / 180;
        const x = ARC_CENTER + ARC_RADIUS * Math.cos(radians);
        const y = ARC_CENTER + ARC_RADIUS * Math.sin(radians);
        arcThumb.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${(arcAngle + 90).toFixed(2)})`);
      }

      function syncArcAccessibility() {
        const relativeStep = arcStep - ARC_CENTER_STEP;
        arcSlider.setAttribute('aria-valuenow', String(relativeStep));
        arcSlider.setAttribute('aria-valuetext', relativeStep === 0
          ? 'Centered'
          : `Reasoning ${Math.abs(relativeStep)} steps ${relativeStep > 0 ? 'higher' : 'lower'}`);
      }

      function updateArcThumb() {
        positionArcThumb(arcStep);
        syncArcAccessibility();
      }

      function cancelArcReturn(adoptVisualPosition = false) {
        clearTimeout(arcReturnTimer);
        arcReturnTimer = 0;
        if (arcReturnFrame) cancelAnimationFrame(arcReturnFrame);
        arcReturnFrame = 0;
        arcSlider.classList.remove('returning');
        if (adoptVisualPosition) {
          arcStep = Math.round(arcVisualStep);
          updateArcThumb();
        }
      }

      function returnArcToCenter() {
        cancelArcReturn();
        const fromStep = arcVisualStep;
        const distance = ARC_CENTER_STEP - fromStep;
        arcStep = ARC_CENTER_STEP;
        syncArcAccessibility();
        if (Math.abs(distance) < .01) {
          positionArcThumb(ARC_CENTER_STEP);
          return;
        }
        const startedAt = performance.now();
        arcSlider.classList.add('returning');
        const animateReturn = (now) => {
          const progress = Math.min(1, (now - startedAt) / ARC_RETURN_MS);
          const eased = 1 - Math.pow(1 - progress, 3);
          positionArcThumb(fromStep + distance * eased);
          if (progress < 1) arcReturnFrame = requestAnimationFrame(animateReturn);
          else {
            arcReturnFrame = 0;
            arcSlider.classList.remove('returning');
            positionArcThumb(ARC_CENTER_STEP);
          }
        };
        arcReturnFrame = requestAnimationFrame(animateReturn);
      }

      function scheduleArcReturn(delay = 90) {
        clearTimeout(arcReturnTimer);
        arcReturnTimer = window.setTimeout(returnArcToCenter, delay);
      }

      function emitArcRotation(delta) {
        if (!paired || !delta) return;
        setEvent(delta > 0 ? 'ENC_CC · REASONING +' : 'ENC_CW · REASONING −');
      }

      function setArcStep(nextStep, emit = true) {
        cancelArcReturn(true);
        const clamped = Math.max(0, Math.min(ARC_STEP_COUNT, nextStep));
        if (clamped === arcStep) return;
        const delta = clamped - arcStep;
        arcStep = clamped;
        updateArcThumb();
        if (emit) emitArcRotation(delta);
      }

      function updateArcFromPointer(clientX, clientY) {
        const rect = arcSlider.getBoundingClientRect();
        const x = (clientX - rect.left) * (466 / rect.width);
        const y = (clientY - rect.top) * (466 / rect.height);
        const rawAngle = (Math.atan2(y - ARC_CENTER, x - ARC_CENTER) * 180 / Math.PI + 360) % 360;
        const candidates = [rawAngle - 360, rawAngle, rawAngle + 360];
        const unwrapped = candidates.reduce((best, candidate) =>
          Math.abs(candidate - arcAngle) < Math.abs(best - arcAngle) ? candidate : best
        );
        const clampedAngle = Math.max(ARC_START_DEGREES, Math.min(ARC_END_DEGREES, unwrapped));
        const nextStep = Math.round((clampedAngle - ARC_START_DEGREES) / (ARC_END_DEGREES - ARC_START_DEGREES) * ARC_STEP_COUNT);
        if (nextStep !== arcStep) {
          setArcStep(nextStep);
          arcMoved = true;
          clearTimeout(arcHoldTimer);
        }
      }

      updateArcThumb();

      arcSlider.addEventListener('pointerdown', (event) => {
        if (!paired || !arcThumb.contains(event.target)) return;
        cancelArcReturn(true);
        arcPointer = event.pointerId;
        arcMoved = false;
        arcLong = false;
        arcSlider.classList.add('dragging');
        clearTimeout(arcHoldTimer);
        arcHoldTimer = window.setTimeout(() => {
          arcLong = true;
          setEvent('OPEN CODEX MICRO SETTINGS');
        }, 500);
      });
      document.addEventListener('pointermove', (event) => {
        if (event.pointerId !== arcPointer || arcLong) return;
        updateArcFromPointer(event.clientX, event.clientY);
      });
      const releaseArc = (event) => {
        if (arcPointer === null || (event.pointerId !== undefined && event.pointerId !== arcPointer)) return;
        clearTimeout(arcHoldTimer);
        arcPointer = null;
        arcSlider.classList.remove('dragging');
        if (arcLong) setEvent('SETTINGS · REQUESTED');
        else if (!arcMoved) setEvent('ENC · REASONING SELECT');
        returnArcToCenter();
      };
      document.addEventListener('pointerup', releaseArc);
      document.addEventListener('pointercancel', releaseArc);
      arcSlider.addEventListener('wheel', (event) => {
        event.preventDefault();
        setArcStep(arcStep + (event.deltaY > 0 ? -1 : 1));
        scheduleArcReturn();
      }, { passive: false });
      arcSlider.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') { event.preventDefault(); setArcStep(arcStep - 1); scheduleArcReturn(); }
        if (event.key === 'ArrowRight') { event.preventDefault(); setArcStep(arcStep + 1); scheduleArcReturn(); }
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          setEvent('ENC · REASONING SELECT');
        }
      });

      let touchLong = false;
      let touchHoldTimer = 0;

      touchControl.addEventListener('pointerdown', (event) => {
        if (!paired) return;
        touchLong = false;
        touchControl.classList.add('is-pressed');
        touchControl.setPointerCapture?.(event.pointerId);
        clearTimeout(touchHoldTimer);
        touchHoldTimer = window.setTimeout(() => {
          touchLong = true;
          setPaired(false);
        }, 3000);
      });
      touchControl.addEventListener('pointerup', () => {
        clearTimeout(touchHoldTimer);
        touchControl.classList.remove('is-pressed');
        if (!paired || touchLong) return;
        setEvent('TOUCH · READY');
      });
      touchControl.addEventListener('pointercancel', () => {
        clearTimeout(touchHoldTimer);
        touchControl.classList.remove('is-pressed');
      });

      function pressHardware(which, pointerId) {
        if (!paired) return;
        const button = which === 'A' ? keyA : keyB;
        if (pointerId !== undefined) button.setPointerCapture?.(pointerId);
        held.add(which);
        button.classList.add('held');
        (which === 'A' ? reviewKeyA : reviewKeyB)?.classList.add('held');
        const other = which === 'A' ? 'B' : 'A';
        if (held.has(other)) {
          comboLatched = true;
          reviewCombo?.classList.add('held');
          setMicActive(false);
          showPage(page === 0 ? 1 : 0);
        } else if (which === 'A') {
          setMicActive(true);
          setEvent('VOICE · HOLD TO TALK');
        } else {
          setEvent('SEND · READY');
        }
      }

      function releaseHardware(which) {
        const triggerSingleAction = paired && held.has(which) && !comboLatched;
        held.delete(which);
        (which === 'A' ? keyA : keyB)?.classList.remove('held');
        (which === 'A' ? reviewKeyA : reviewKeyB)?.classList.remove('held');
        if (held.size < 2) reviewCombo?.classList.remove('held');
        if (triggerSingleAction) {
          if (which === 'A') releaseMicControl();
          else setEvent('SEND MESSAGE');
        }
        if (held.size === 0) comboLatched = false;
      }

      [[keyA, 'A'], [keyB, 'B']].forEach(([button, key]) => {
        if (!button) return;
        button.addEventListener('pointerdown', (event) => pressHardware(key, event.pointerId));
        button.addEventListener('pointerup', () => releaseHardware(key));
        button.addEventListener('pointercancel', () => releaseHardware(key));
        button.addEventListener('lostpointercapture', () => releaseHardware(key));
      });

      [[reviewKeyA, 'A'], [reviewKeyB, 'B']].forEach(([button, key]) => {
        if (!button) return;
        button.addEventListener('pointerdown', (event) => {
          button.setPointerCapture?.(event.pointerId);
          pressHardware(key);
        });
        button.addEventListener('pointerup', () => releaseHardware(key));
        button.addEventListener('pointercancel', () => releaseHardware(key));
        button.addEventListener('lostpointercapture', () => releaseHardware(key));
      });

      const releaseReviewCombo = () => {
        releaseHardware('B');
        releaseHardware('A');
        reviewCombo?.classList.remove('held');
      };
      reviewCombo?.addEventListener('pointerdown', (event) => {
        reviewCombo.setPointerCapture?.(event.pointerId);
        reviewCombo.classList.add('held');
        pressHardware('A');
        pressHardware('B');
      });
      reviewCombo?.addEventListener('pointerup', releaseReviewCombo);
      reviewCombo?.addEventListener('pointercancel', releaseReviewCombo);
      reviewCombo?.addEventListener('lostpointercapture', releaseReviewCombo);
      window.addEventListener('keydown', (event) => {
        if (event.repeat) return;
        const key = event.key.toLowerCase();
        if (key === 'p') {
          setPaired(!paired);
          return;
        }
        if (!paired) return;
        if (key === 'a') pressHardware('A');
        else if (key === 'd') pressHardware('B');
      });
      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a') releaseHardware('A');
        if (key === 'd') releaseHardware('B');
      });

      setPaired(initialPaired);
      if (initialPaired && initialMic) pressHardware('A');
    })();
  </script>
</body>
</html>
